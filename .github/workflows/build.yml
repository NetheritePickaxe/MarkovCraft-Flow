name: Build

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
    inputs:
      targetPlatform:
        description: 'Target platform (e.g. StandaloneWindows64, Android, StandaloneOSX)'
        required: true
        default: 'StandaloneWindows64'

env:
  UNITY_VERSION: 6000.3.9f1

jobs:
  build:
    name: Build ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneWindows64
          - Android
        include:
          - targetPlatform: StandaloneWindows64
            artifactName: MarkovCraft-Flow-Windows
          - targetPlatform: Android
            artifactName: MarkovCraft-Flow-Android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - name: Decode Android keystore
        if: matrix.targetPlatform == 'Android'
        run: |
          mkdir -p ${{ github.workspace }}/Keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/Keystore/markovcraft.keystore

      - name: Write Unity license file
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          # game-ci/unity-builder@v4 extracts a serial from the .ulf and activates
          # via `unity-editor -serial`, which Unity 6 Personal rejects with
          # "Code 20110 (serial invalid)". Place the .ulf directly at the path
          # Unity reads inside the container (/root/.local/share/unity3d/Unity/)
          # and skip activation so the broken serial path is bypassed.
          # UNITY_LICENSE may be raw .ulf XML or base64-encoded; handle both.
          LICENSE_DIR="$RUNNER_TEMP/_github_home/.local/share/unity3d/Unity"
          mkdir -p "$LICENSE_DIR"
          if printf '%s' "$UNITY_LICENSE" | grep -q '^<'; then
            printf '%s' "$UNITY_LICENSE" > "$LICENSE_DIR/Unity_lic.ulf"
          elif DECODED=$(printf '%s' "$UNITY_LICENSE" | base64 -d 2>/dev/null) \
               && printf '%s' "$DECODED" | grep -q '^<'; then
            printf '%s' "$DECODED" > "$LICENSE_DIR/Unity_lic.ulf"
          else
            printf '%s' "$UNITY_LICENSE" > "$LICENSE_DIR/Unity_lic.ulf"
          fi
          echo "Wrote Unity_lic.ulf ($(wc -c < "$LICENSE_DIR/Unity_lic.ulf") bytes)"

      - name: Build Unity project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: MarkovCraft-Flow
          buildsPath: builds
          skipActivation: true
          androidExportType: androidAppBundle
          androidKeystoreName: Keystore/markovcraft.keystore
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEY_ALIAS }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: builds/${{ matrix.targetPlatform }}
          if-no-files-found: error