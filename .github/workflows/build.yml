name: Build

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
    inputs:
      targetPlatform:
        description: 'Target platform (e.g. StandaloneWindows64, Android, StandaloneOSX)'
        required: true
        default: 'StandaloneWindows64'

env:
  UNITY_VERSION: 6000.3.9f1

jobs:
  build:
    name: Build ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneWindows64
          - Android
        include:
          - targetPlatform: StandaloneWindows64
            artifactName: MarkovCraft-Flow-Windows
            imageVariant: windows-mono
          - targetPlatform: Android
            artifactName: MarkovCraft-Flow-Android
            imageVariant: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - name: Decode Android keystore
        if: matrix.targetPlatform == 'Android'
        run: |
          mkdir -p ${{ github.workspace }}/Keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/Keystore/markovcraft.keystore

      - name: Activate Unity Personal license
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          # Unity 6 Personal uses entitlement-based licensing (no serial).
          # game-ci's activate.sh extracts a "serial" from the .ulf and passes
          # -serial to unity-editor, which Unity 6 rejects with "Code 20110".
          # Pre-activate with email/password only (no -serial) to store the
          # entitlement license + access token in /root (mounted from
          # RUNNER_TEMP/_github_home). Then game-ci runs with skipActivation=true
          # and finds the valid license + access token.
          #
          # We use the same image variant as the build step so the default
          # /etc/machine-id matches between the two containers.
          mkdir -p /tmp/BlankProject/Assets

          docker run --rm \
            -v "$RUNNER_TEMP/_github_home:/root:z" \
            -v "/tmp/BlankProject:/BlankProject:z" \
            -e UNITY_EMAIL \
            -e UNITY_PASSWORD \
            "unityci/editor:ubuntu-${{ env.UNITY_VERSION }}-${{ matrix.imageVariant }}-3" \
            bash -c 'mkdir -p /BlankProject/Assets && unity-editor -batchmode -nographics -quit -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -projectPath /BlankProject -logFile /dev/stdout || true'

          echo "--- License files ---"
          ls -la "$RUNNER_TEMP/_github_home/.local/share/unity3d/Unity/" 2>/dev/null || echo "No license in .local/share"
          ls -la "$RUNNER_TEMP/_github_home/.local/share/unity3d/" 2>/dev/null || echo "No .local/share/unity3d"
          ls -la "$RUNNER_TEMP/_github_home/.config/unity3d/" 2>/dev/null || echo "No .config/unity3d"

          if [ ! -f "$RUNNER_TEMP/_github_home/.local/share/unity3d/Unity/Unity_lic.ulf" ]; then
            echo "::error::Unity license file was not created during pre-activation"
            exit 1
          fi
          echo "Pre-activation complete."

      - name: Build Unity project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          # Set a dummy serial that does NOT start with "F" so entrypoint.sh
          # does not randomize /etc/machine-id. This keeps the machine ID
          # consistent with the pre-activation container (same docker image).
          # skipActivation=true means activate.sh is never run, so the serial
          # is never actually used for activation.
          UNITY_SERIAL: skip-activation-personal
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: MarkovCraft-Flow
          buildsPath: builds
          skipActivation: true
          androidExportType: androidAppBundle
          androidKeystoreName: Keystore/markovcraft.keystore
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEY_ALIAS }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: builds/${{ matrix.targetPlatform }}
          if-no-files-found: error
